<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t">
  <title id="t">Power plants and transmission lines feeding electricity into rows of server racks</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1407"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="c"><rect width="600" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="600" height="420" fill="url(#bg)"/>

    <!-- smoke from gas plant -->
    <g fill="#64748b" opacity=".5" filter="url(#blur)">
      <ellipse cx="96" cy="90" rx="36" ry="22"/><ellipse cx="128" cy="62" rx="30" ry="18"/><ellipse cx="160" cy="44" rx="26" ry="14"/>
    </g>
    <!-- power plant -->
    <g>
      <rect x="40" y="200" width="120" height="90" fill="#3f3a33"/>
      <rect x="80" y="110" width="22" height="100" fill="#57514a"/>
      <rect x="110" y="130" width="22" height="80" fill="#4a453f"/>
      <rect x="80" y="110" width="22" height="8" fill="#ef4444" opacity=".8"/>
      <g fill="#fbbf24" opacity=".85">
        <rect x="52" y="220" width="14" height="10"/><rect x="74" y="220" width="14" height="10"/>
        <rect x="120" y="220" width="14" height="10"/><rect x="52" y="244" width="14" height="10"/>
      </g>
    </g>
    <!-- wind turbine (cleaner alternative) -->
    <g transform="translate(220 150)" stroke="#cbd5e1" stroke-linecap="round">
      <path d="M0 0 V140" stroke-width="5"/>
      <g>
        <path d="M0 0 L0 -56" stroke-width="5"/>
        <path d="M0 0 L48 28" stroke-width="5"/>
        <path d="M0 0 L-48 28" stroke-width="5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </g>
      <circle r="6" fill="#e2e8f0" stroke="none"/>
    </g>

    <!-- ground -->
    <rect y="290" width="600" height="130" fill="#0f172a"/>

    <!-- lines from plant to racks -->
    <path d="M160 230 C260 230 280 180 360 190" stroke="#f59e0b" stroke-width="3" fill="none" opacity=".6"/>
    <path d="M160 230 C260 230 280 180 360 190" stroke="#fde68a" stroke-width="3" fill="none" stroke-dasharray="6 14" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- server racks -->
    <ellipse cx="460" cy="230" rx="170" ry="110" fill="url(#glow)"/>
    <g>
      <rect x="360" y="120" width="70" height="200" rx="6" fill="url(#rack)"/>
      <rect x="440" y="100" width="70" height="220" rx="6" fill="url(#rack)"/>
      <rect x="520" y="130" width="70" height="190" rx="6" fill="url(#rack)"/>
      <g fill="#0f172a">
        <rect x="368" y="132" width="54" height="14" rx="2"/><rect x="368" y="154" width="54" height="14" rx="2"/>
        <rect x="368" y="176" width="54" height="14" rx="2"/><rect x="368" y="198" width="54" height="14" rx="2"/>
        <rect x="368" y="220" width="54" height="14" rx="2"/><rect x="368" y="242" width="54" height="14" rx="2"/>
        <rect x="448" y="112" width="54" height="14" rx="2"/><rect x="448" y="134" width="54" height="14" rx="2"/>
        <rect x="448" y="156" width="54" height="14" rx="2"/><rect x="448" y="178" width="54" height="14" rx="2"/>
        <rect x="448" y="200" width="54" height="14" rx="2"/><rect x="448" y="222" width="54" height="14" rx="2"/>
        <rect x="448" y="244" width="54" height="14" rx="2"/>
        <rect x="528" y="142" width="54" height="14" rx="2"/><rect x="528" y="164" width="54" height="14" rx="2"/>
        <rect x="528" y="186" width="54" height="14" rx="2"/><rect x="528" y="208" width="54" height="14" rx="2"/>
        <rect x="528" y="230" width="54" height="14" rx="2"/>
      </g>
      <g fill="#fbbf24">
        <circle cx="374" cy="139" r="2.5"/><circle cx="374" cy="183" r="2.5"/><circle cx="374" cy="227" r="2.5"/>
        <circle cx="454" cy="119" r="2.5"/><circle cx="454" cy="163" r="2.5"/><circle cx="454" cy="207" r="2.5"/><circle cx="454" cy="251" r="2.5"/>
        <circle cx="534" cy="149" r="2.5"/><circle cx="534" cy="193" r="2.5"/><circle cx="534" cy="237" r="2.5"/>
      </g>
      <g fill="#22d3ee">
        <circle cx="382" cy="161" r="2.5"><animate attributeName="opacity" values="1;.1;1" dur="1s" repeatCount="indefinite"/></circle>
        <circle cx="462" cy="141" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="462" cy="229" r="2.5"><animate attributeName="opacity" values="1;.1;1" dur=".8s" repeatCount="indefinite"/></circle>
        <circle cx="542" cy="171" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="1.4s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- bolt badge -->
    <g transform="translate(270 300)">
      <circle r="44" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
      <path d="M6 -28 L-16 4 H0 L-6 28 L16 -4 H0z" fill="url(#bolt)"/>
    </g>
  </g>
</svg>
