<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t">
  <title id="t">A data center drawing water from a shrinking reservoir into cooling towers that evaporate it into the air</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde7c7"/>
      <stop offset="1" stop-color="#f8c99a"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6a46c"/>
      <stop offset="1" stop-color="#b9824d"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="c"><rect width="600" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="600" height="420" fill="url(#sky)"/>
    <!-- sun -->
    <circle cx="110" cy="80" r="44" fill="#fb923c" opacity=".9"/>
    <circle cx="110" cy="80" r="64" fill="#fb923c" opacity=".18"/>

    <!-- vapor -->
    <g fill="#fff" opacity=".85" filter="url(#blur)">
      <ellipse cx="390" cy="110" rx="46" ry="26"/><ellipse cx="420" cy="74" rx="38" ry="22"/>
      <ellipse cx="500" cy="118" rx="44" ry="24"/><ellipse cx="530" cy="80" rx="36" ry="20"/>
    </g>

    <!-- distant mesas -->
    <path d="M0 230 L40 200 H120 L150 230 H260 L280 210 H340 L360 230 H600 V420 H0z" fill="#c98f58" opacity=".7"/>
    <rect y="230" width="600" height="190" fill="url(#land)"/>

    <!-- dry lakebed with shrinking water -->
    <ellipse cx="150" cy="330" rx="130" ry="48" fill="#e8c497"/>
    <ellipse cx="150" cy="330" rx="130" ry="48" fill="none" stroke="#a8743f" stroke-width="2" stroke-dasharray="6 6"/>
    <ellipse cx="150" cy="334" rx="80" ry="28" fill="url(#lake)">
      <animate attributeName="rx" values="86;74;86" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- cracks -->
    <g stroke="#a8743f" stroke-width="1.5" fill="none" opacity=".7">
      <path d="M40 320 l12 6 l-4 10 l10 4"/><path d="M250 318 l-10 8 l6 8 l-8 8"/>
      <path d="M70 355 l14 -4 l6 8"/><path d="M226 350 l-12 -2 l-6 10"/>
    </g>

    <!-- pipe -->
    <path d="M220 330 H300 Q320 330 320 310 V290" stroke="#0369a1" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M220 330 H300 Q320 330 320 310 V290" stroke="#bae6fd" stroke-width="3" fill="none" stroke-dasharray="4 10" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- data center -->
    <rect x="300" y="210" width="270" height="90" fill="url(#bldg)"/>
    <rect x="296" y="204" width="278" height="10" rx="2" fill="#94a3b8"/>
    <g fill="#64748b">
      <rect x="318" y="232" width="40" height="8" rx="2"/><rect x="370" y="232" width="40" height="8" rx="2"/>
      <rect x="422" y="232" width="40" height="8" rx="2"/><rect x="474" y="232" width="40" height="8" rx="2"/>
      <rect x="526" y="232" width="30" height="8" rx="2"/>
      <rect x="318" y="252" width="40" height="8" rx="2"/><rect x="370" y="252" width="40" height="8" rx="2"/>
      <rect x="422" y="252" width="40" height="8" rx="2"/><rect x="474" y="252" width="40" height="8" rx="2"/>
      <rect x="526" y="252" width="30" height="8" rx="2"/>
    </g>
    <!-- cooling towers -->
    <g>
      <path d="M362 204 L356 150 H426 L420 204z" fill="#94a3b8"/>
      <ellipse cx="391" cy="150" rx="35" ry="7" fill="#64748b"/>
      <path d="M474 204 L468 156 H536 L530 204z" fill="#94a3b8"/>
      <ellipse cx="502" cy="156" rx="34" ry="7" fill="#64748b"/>
    </g>

    <!-- droplets rising -->
    <g fill="#0ea5e9">
      <path d="M391 140 c0 6 -4 9 -8 9 s-8 -3 -8 -9 c0 -6 8 -14 8 -14 s8 8 8 14z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -40" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M510 146 c0 6 -4 9 -8 9 s-8 -3 -8 -9 c0 -6 8 -14 8 -14 s8 8 8 14z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -40" dur="2.8s" begin=".6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.8s" begin=".6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- houses (community) -->
    <g transform="translate(330 330)">
      <path d="M0 30 V10 L18 -6 L36 10 V30z" fill="#7c4a24"/>
      <rect x="13" y="16" width="10" height="14" fill="#fde68a"/>
      <path d="M50 30 V12 L66 -2 L82 12 V30z" fill="#8b5a2b"/>
      <rect x="61" y="17" width="10" height="13" fill="#fde68a"/>
      <path d="M96 30 V8 L114 -8 L132 8 V30z" fill="#7c4a24"/>
      <rect x="109" y="14" width="10" height="16" fill="#fde68a"/>
    </g>
  </g>
</svg>
