<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="t">
  <title id="t">A laptop sending a chat prompt to a large data center at night, which draws power from transmission lines and releases water vapor from cooling towers</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a5c"/>
      <stop offset="1" stop-color="#1c2944"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4d73"/>
      <stop offset="1" stop-color="#2c3b5d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="600" height="480" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="480" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#e2e8f0">
      <circle cx="60" cy="50" r="1.4" opacity=".8"/><circle cx="140" cy="90" r="1" opacity=".6"/>
      <circle cx="220" cy="40" r="1.6" opacity=".9"/><circle cx="300" cy="78" r="1" opacity=".5"/>
      <circle cx="370" cy="30" r="1.2" opacity=".7"/><circle cx="520" cy="60" r="1.5" opacity=".8"/>
      <circle cx="560" cy="120" r="1" opacity=".5"/><circle cx="100" cy="150" r="1" opacity=".4"/>
      <circle cx="260" cy="130" r="1.1" opacity=".5"/>
    </g>
    <!-- moon -->
    <circle cx="470" cy="80" r="26" fill="#f1f5f9" opacity=".9"/>
    <circle cx="482" cy="72" r="24" fill="#152241"/>

    <!-- far hills -->
    <path d="M0 300 C90 260 160 280 240 262 S420 240 600 270 V480 H0z" fill="#16223d"/>

    <!-- transmission tower + lines -->
    <g stroke="#64748b" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M58 330 L78 170 L98 330"/>
      <path d="M64 280 H92 M68 240 H88 M72 205 H84"/>
      <path d="M64 280 L88 240 M92 280 L68 240 M68 240 L84 205 M88 240 L72 205"/>
      <path d="M50 190 H106 M56 215 H100"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.4" fill="none" opacity=".8">
      <path d="M50 190 Q130 230 214 222"/>
      <path d="M106 190 Q160 224 214 232"/>
      <path d="M0 200 Q25 205 50 190"/>
    </g>
    <!-- power pulses on line -->
    <g fill="#fbbf24">
      <circle cx="140" cy="214" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="222" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- steam from cooling towers -->
    <g fill="#cbd5e1" opacity=".55" filter="url(#soft)">
      <ellipse cx="300" cy="150" rx="40" ry="24"/>
      <ellipse cx="330" cy="118" rx="34" ry="20"/>
      <ellipse cx="420" cy="140" rx="44" ry="26"/>
      <ellipse cx="452" cy="106" rx="36" ry="20"/>
    </g>

    <!-- ground -->
    <path d="M0 330 H600 V480 H0z" fill="url(#ground)"/>

    <!-- data center halo -->
    <ellipse cx="370" cy="300" rx="230" ry="90" fill="url(#halo)"/>

    <!-- cooling towers on roof -->
    <g>
      <path d="M282 220 L276 186 H326 L320 220z" fill="#4b5f88"/>
      <rect x="274" y="180" width="54" height="8" rx="2" fill="#5b709b"/>
      <path d="M402 220 L396 180 H452 L446 220z" fill="#4b5f88"/>
      <rect x="394" y="174" width="60" height="8" rx="2" fill="#5b709b"/>
      <g stroke="#2c3b5d" stroke-width="2">
        <path d="M286 196 H316 M287 206 H315"/>
        <path d="M406 192 H442 M407 204 H441"/>
      </g>
    </g>

    <!-- main building -->
    <rect x="214" y="216" width="330" height="18" rx="3" fill="url(#roof)"/>
    <rect x="222" y="232" width="314" height="110" fill="url(#wall)"/>
    <rect x="222" y="232" width="314" height="6" fill="#0f172a" opacity=".35"/>

    <!-- server windows -->
    <g fill="url(#glow)">
      <rect x="240" y="252" width="44" height="12" rx="2"/>
      <rect x="296" y="252" width="44" height="12" rx="2" opacity=".8"/>
      <rect x="352" y="252" width="44" height="12" rx="2"/>
      <rect x="408" y="252" width="44" height="12" rx="2" opacity=".7"/>
      <rect x="464" y="252" width="54" height="12" rx="2"/>
      <rect x="240" y="276" width="44" height="12" rx="2" opacity=".75"/>
      <rect x="296" y="276" width="44" height="12" rx="2"/>
      <rect x="352" y="276" width="44" height="12" rx="2" opacity=".85"/>
      <rect x="408" y="276" width="44" height="12" rx="2"/>
      <rect x="464" y="276" width="54" height="12" rx="2" opacity=".7"/>
    </g>
    <!-- blinking server lights -->
    <g fill="#22d3ee">
      <circle cx="246" cy="300" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="254" cy="300" r="2"><animate attributeName="opacity" values="0;1;0" dur=".9s" repeatCount="indefinite"/></circle>
      <circle cx="302" cy="300" r="2"><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="358" cy="300" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="414" cy="300" r="2"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="300" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- door + loading bay -->
    <rect x="480" y="306" width="40" height="36" fill="#0f172a" opacity=".6"/>
    <rect x="236" y="314" width="70" height="28" fill="#0f172a" opacity=".45"/>

    <!-- water pipe to building -->
    <path d="M600 372 H560 Q540 372 540 352 V342" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M600 372 H560 Q540 372 540 352 V342" stroke="#e0f2fe" stroke-width="2" fill="none" stroke-dasharray="4 10" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- laptop in foreground -->
    <g transform="translate(36 352)">
      <rect x="0" y="0" width="148" height="92" rx="8" fill="#334155"/>
      <rect x="7" y="7" width="134" height="78" rx="4" fill="url(#screen)"/>
      <rect x="18" y="20" width="76" height="14" rx="7" fill="#475569"/>
      <rect x="44" y="42" width="86" height="14" rx="7" fill="#818cf8"/>
      <rect x="18" y="64" width="58" height="10" rx="5" fill="#475569"/>
      <path d="M-12 92 H160 L150 102 H-2z" fill="#475569"/>
    </g>
    <!-- prompt traveling to data center -->
    <path d="M176 380 C230 380 230 330 236 326" stroke="#818cf8" stroke-width="2" fill="none" stroke-dasharray="3 7" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(150 316)">
      <rect width="66" height="30" rx="15" fill="#818cf8"/>
      <circle cx="20" cy="15" r="3" fill="#0b1220"/><circle cx="33" cy="15" r="3" fill="#0b1220"/><circle cx="46" cy="15" r="3" fill="#0b1220"/>
    </g>
  </g>
</svg>
